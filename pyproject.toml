[project]
name = "ifood-case"
version = "1.0.0"
description = "Pipeline de ingestão e análise das corridas de táxi de NY (case Data Architect)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Os notebooks têm células %sql e %load_ext, que não são Python válido.
# O ruff passou a analisar .ipynb por padrão a partir da 0.6, então excluímos.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]